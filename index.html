<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Punch Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@600;700&display=swap" rel="stylesheet">
<script>
(function () {
  try {
    var t = localStorage.getItem('punchboard-theme');
    if (t && t !== 'classic') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">

  <div id="config-banner" class="config-banner" style="display:none;"></div>

  <header>
    <div class="eyebrow">SHIFT REGISTER · GROUP CLOCK</div>
    <h1 id="app-title">The Punch Board</h1>
    <div class="sub">Clock in, clock out, check in on the vibe, and settle the beer bets.</div>
    <div class="whoami-row">
      <span id="whoami-text">—</span>
      <button class="whoami-switch" id="whoami-switch-btn">switch</button>
      <button class="whoami-switch" id="theme-switch-btn">🎨 theme</button>
    </div>
  </header>
